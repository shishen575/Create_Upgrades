name: Build and Release

on:
  push:
    branches:
      - '1.21.1'
      - '1.20.1'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ github.ref_name }})
    runs-on: ubuntu-latest

    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Java version
        id: java
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "1.21.1" ]; then
            echo "version=21" >> $GITHUB_OUTPUT
          else
            echo "version=17" >> $GITHUB_OUTPUT
          fi

      - name: Set up Java ${{ steps.java.outputs.version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.java.outputs.version }}
          distribution: 'temurin'

      # ForgeGradle (1.20.1) のキャッシュ — 初回は deobf に数分かかる
      - name: Cache Gradle & ForgeGradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ github.ref_name }}-
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1.20.1 (Forge): Create と Flywheel は maven に存在しないため Modrinth から取得してローカル Maven に配置
      - name: Install Create & Flywheel to local Maven (1.20.1 only)
        if: github.ref_name == '1.20.1'
        run: |
          set -e
          CREATE_VERSION=$(grep '^create_version=' gradle.properties | cut -d= -f2)
          FLYWHEEL_VERSION=$(grep '^flywheel_version=' gradle.properties | cut -d= -f2)
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)

          install_jar() {
            local URL="$1" GROUP="$2" ARTIFACT="$3" VERSION="$4" CLASSIFIER="$5"
            local DIR="$HOME/.m2/repository/$(echo "$GROUP" | tr '.' '/')/$ARTIFACT/$VERSION"
            mkdir -p "$DIR"
            local BASENAME="${ARTIFACT}-${VERSION}"
            [ -n "$CLASSIFIER" ] && BASENAME="${BASENAME}-${CLASSIFIER}"
            local JAR="$DIR/${BASENAME}.jar"
            echo "Downloading $URL"
            curl -fsSL "$URL" -o "$JAR"
            # 簡易 POM
            cat > "$DIR/${ARTIFACT}-${VERSION}.pom" <<POMEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>${GROUP}</groupId>
            <artifactId>${ARTIFACT}</artifactId>
            <version>${VERSION}</version>
          </project>
          POMEOF
          }

          # --- Create ---
          CREATE_URL=$(python3 - <<PYEOF
          import urllib.request, json, sys
          url = "https://api.modrinth.com/v2/project/LNytGWDc/version?loaders=%5B%22forge%22%5D&game_versions=%5B%221.20.1%22%5D"
          req = urllib.request.Request(url, headers={"User-Agent": "create-upgrades-ci/1.0"})
          data = json.loads(urllib.request.urlopen(req).read())
          target = "${CREATE_VERSION}"
          for v in data:
              if target in v["version_number"]:
                  for f in v["files"]:
                      if "slim" in f["filename"].lower():
                          print(f["url"]); sys.exit(0)
                  print(v["files"][0]["url"]); sys.exit(0)
          print("NOT_FOUND"); sys.exit(1)
          PYEOF
          )
          echo "Create URL: $CREATE_URL"
          install_jar "$CREATE_URL" "com.simibubi.create" "create-${MC_VERSION}" "$CREATE_VERSION" "slim"

          # --- Flywheel ---
          FLYWHEEL_URL=$(python3 - <<PYEOF
          import urllib.request, json, sys
          # Flywheel (Forge) Modrinth project id
          url = "https://api.modrinth.com/v2/project/flywheel/version?loaders=%5B%22forge%22%5D&game_versions=%5B%221.20.1%22%5D"
          req = urllib.request.Request(url, headers={"User-Agent": "create-upgrades-ci/1.0"})
          try:
              data = json.loads(urllib.request.urlopen(req).read())
          except Exception as e:
              print("NOT_FOUND"); sys.exit(1)
          target = "${FLYWHEEL_VERSION}"
          for v in data:
              if target in v["version_number"]:
                  print(v["files"][0]["url"]); sys.exit(0)
          if data:
              print(data[0]["files"][0]["url"]); sys.exit(0)
          print("NOT_FOUND"); sys.exit(1)
          PYEOF
          )
          echo "Flywheel URL: $FLYWHEEL_URL"
          install_jar "$FLYWHEEL_URL" "com.jozufozu.flywheel" "flywheel-forge-${MC_VERSION}" "$FLYWHEEL_VERSION" ""

      - name: Bump patch version
        id: version
        run: |
          CURRENT=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)

          sed -i "s/^mod_version=.*/mod_version=$NEW_VERSION/" gradle.properties

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "mc_version=$MC_VERSION" >> $GITHUB_OUTPUT
          echo "jar_name=Create-Upgrades-${MC_VERSION}-${NEW_VERSION}.jar" >> $GITHUB_OUTPUT
          echo "tag=v${NEW_VERSION}-mc${MC_VERSION}" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push

      # ForgeGradle は依存関係の deobf を別フェーズで行うため先に解決する (1.20.1 対策)
      - name: Resolve dependencies
        run: ./gradlew dependencies --no-daemon

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Find jar
        id: jar
        run: |
          JAR=$(find build/libs -name "Create-Upgrades-*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" | head -1)
          echo "path=$JAR" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Create_Upgrades ${{ steps.version.outputs.version }} (MC ${{ steps.version.outputs.mc_version }})"
          body: |
            ## Create_Upgrades ${{ steps.version.outputs.version }}

            **Minecraft:** ${{ steps.version.outputs.mc_version }}
            **Branch:** ${{ github.ref_name }}

            > ⚠️ これはテストビルドです。安定版ではありません。
          prerelease: true
          files: ${{ steps.jar.outputs.path }}
          token: ${{ secrets.GITHUB_TOKEN }}
