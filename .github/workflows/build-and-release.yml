name: Build and Release

on:
  push:
    branches:
      - '1.21.1'
      - '1.20.1'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ github.ref_name }})
    runs-on: ubuntu-latest

    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Java version
        id: java
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "1.21.1" ]; then
            echo "version=21" >> $GITHUB_OUTPUT
          else
            echo "version=17" >> $GITHUB_OUTPUT
          fi

      - name: Set up Java ${{ steps.java.outputs.version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.java.outputs.version }}
          distribution: 'temurin'

      # ForgeGradle (1.20.1) のキャッシュ — 初回は deobf に数分かかる
      - name: Cache Gradle & ForgeGradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ github.ref_name }}-
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Bump patch version
        id: version
        run: |
          CURRENT=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)

          sed -i "s/^mod_version=.*/mod_version=$NEW_VERSION/" gradle.properties

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "mc_version=$MC_VERSION" >> $GITHUB_OUTPUT
          echo "jar_name=Create-Upgrades-${MC_VERSION}-${NEW_VERSION}.jar" >> $GITHUB_OUTPUT
          echo "tag=v${NEW_VERSION}-mc${MC_VERSION}" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push

      # ForgeGradle は依存関係の deobf を別フェーズで行うため先に解決する (1.20.1 対策)
      - name: Resolve dependencies
        run: ./gradlew dependencies --no-daemon

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Find jar
        id: jar
        run: |
          JAR=$(find build/libs -name "Create-Upgrades-*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" | head -1)
          echo "path=$JAR" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Create_Upgrades ${{ steps.version.outputs.version }} (MC ${{ steps.version.outputs.mc_version }})"
          body: |
            ## Create_Upgrades ${{ steps.version.outputs.version }}

            **Minecraft:** ${{ steps.version.outputs.mc_version }}
            **Branch:** ${{ github.ref_name }}

            > ⚠️ これはテストビルドです。安定版ではありません。
          prerelease: true
          files: ${{ steps.jar.outputs.path }}
          token: ${{ secrets.GITHUB_TOKEN }}
